<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My New Tab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="popup-card">
        <div class="popup-header">
            <div class="popup-icon">⚡</div>
            <div class="popup-title-group">
                <h2>My New Tab</h2>
                <span class="version-badge">v1.0</span>
            </div>
        </div>
        <p class="popup-desc">Your aesthetic, productivity-focused new tab dashboard.</p>
        <div class="popup-actions">
            <button id="open-new-tab-btn" class="primary-btn">
                <span>Open New Tab</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
