<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./Components/Contests_Sidebar/contests.css">
    <link rel="stylesheet" href="./Components/Bookmarks/bookmarks.css">
    <link rel="stylesheet" href="./Components/Bookmarks/aesthetic-bookmarks.css">
    <link rel="stylesheet" href="./Components/AddShortcut/style.css">
    <link rel="stylesheet" href="./Components/SidePanel/style.css">
    <link rel="stylesheet" href="./Components/Spotify/spotify.css">
    <link rel="stylesheet" href="./Components/ContextMenu/contextMenu.css">
    <link rel="stylesheet" href="./Components/StickyNotes/sticky-notes.css">

    <div id="spotify-controller" class="spotify-controller hidden">
        <div class="spotify-now-playing">
            <div id="spotify-track-name">Not playing</div>
            <div id="spotify-track-artist">Connect Spotify to start</div>
        </div>
        <div class="spotify-seek-row">
            <span id="spotify-current-time">0:00</span>
            <input type="range" id="spotify-seek" min="0" max="100" value="0">
            <span id="spotify-total-time">0:00</span>
        </div>
        <div class="spotify-controls">
            <button id="spotify-prev" type="button">⏮</button>
            <button id="spotify-play" type="button">▶</button>
            <button id="spotify-next" type="button">⏭</button>
            <input type="range" id="spotify-volume" min="0" max="100" value="75" aria-label="Volume">
        </div>
    </div>

</head>

<body>


    <header>
        <div id="clock-widget" class="clock-widget">
            <div id="clock-time" class="clock-time">00:00</div>
            <div id="clock-date" class="clock-date">Mon, Jan 01</div>
        </div>
        <div class="search-container">
            <input type="text" placeholder="Search...">
            <button type="submit">🔍</button>
        </div>
    </header>



    <div class="background"></div>



    <div class="sidebar">
        <div class="sidebar-toggle" id="sidebarToggle">
            <p id="arrow">▼ </p>
            <p>Upcoming Contests</p>
        </div>
        <div class="contest-list" id="contestList">
            <ul id="contests"></ul>
        </div>
    </div>




    <div class="bookmark-sidebar">
        <ul class="bookmark-list"></ul>
    </div>





    <!-- Aesthetic Bookmark Box -->
    <div id="aesthetic-bookmark-box" class="aesthetic-bookmark-box collapsed">
        <div class="bookmark-box-header">
            <h3>📚 All Bookmarks</h3>
            <button id="bookmark-box-toggle" class="bookmark-box-toggle">+</button>
        </div>
        <div class="bookmark-box-content">
            <div class="bookmark-folders">
                <!-- Bookmark folders will be populated here -->
            </div>
            <div class="bookmark-items">
                <!-- Non-bookmark-bar bookmarks will be populated here -->
            </div>
        </div>
    </div>

    <!-- Hidden file input to select background image -->
    <input type="file" id="backgroundFileInput" accept="image/*" style="display: none;" />
    <!-- Sticky Notes button -->
    <button id="add-sticky-note-btn" class="add-sticky-note-btn">📝</button>
    <!-- Change Background button -->
    <button id="changeBackgroundBtn"></button>






    <!-- Drawer Section -->
    <div id="shortcut-drawer">
        <div id="shortcuts-container">
            <button id="add-shortcut-btn">+</button>
        </div>
    </div>

    <!-- Shortcut Modal -->
    <div id="shortcut-modal" class="hidden">
        <div class="modal-content">
            <input type="text" id="shortcut-name" placeholder="Name">
            <input type="text" id="shortcut-url" placeholder="URL">
            <div class="modal-buttons">
                <button id="save-shortcut">Save</button>
                <button id="cancel-shortcut">Cancel</button>
            </div>
        </div>
    </div>





    <!-- Right Side Drawer Toggle Button -->
    <button id="open-right-drawer">⚙️</button>
    <!-- Right Side Drawer -->
    <div id="right-drawer">
        <h3>Settings</h3>

        <div class="drawer-option">
            <label for="toggle-contests">Show Upcoming Contests</label>
            <label class="switch">
                <input type="checkbox" id="toggle-contests" class="toggle-switch" data-target=".sidebar" checked>
                <span class="slider round"></span>
            </label>
        </div>

        <div class="drawer-option">
            <label for="toggle-shortcuts">Show Shortcuts</label>
            <label class="switch">
                <input type="checkbox" id="toggle-shortcuts" class="toggle-switch" data-target="#shortcut-drawer"
                    checked>
                <span class="slider round"></span>
            </label>
        </div>

        <div class="drawer-option">
            <label for="toggle-bookmarks">Show All Bookmarks</label>
            <label class="switch">
                <input type="checkbox" id="toggle-bookmarks" class="toggle-switch" data-target="#aesthetic-bookmark-box"
                    checked>
                <span class="slider round"></span>
            </label>
        </div>

        <div class="drawer-option">
            <label for="toggle-sticky-notes">Show Sticky Notes</label>
            <label class="switch">
                <input type="checkbox" id="toggle-sticky-notes" class="toggle-switch" data-target="#add-sticky-note-btn"
                    checked>
                <span class="slider round"></span>
            </label>
        </div>

        <div class="drawer-option">
            <label for="clear-empty-notes">Clear Empty Notes</label>
            <button id="clear-empty-notes" class="refresh-icon-button">
                🧹
            </button>
        </div>

        <div class="drawer-option drawer-option-stack">
            <label for="spotify-client-id">Spotify Integration</label>
            <input type="text" id="spotify-client-id" class="drawer-input" placeholder="Spotify Client ID">
            <button id="spotify-auth-button" class="refresh-icon-button spotify-auth-button" type="button">Connect</button>
        </div>
        
    </div>








    <script src="script.js"></script>
    <script src="./Components/Contests_Sidebar/contests.js"></script>
    <script src="./Components/Bookmarks/bookmarks.js"></script>
    <script src="./Components/Bookmarks/aesthetic-bookmarks.js"></script>
    <script src="./Components/AddShortcut/script.js"></script>
    <script src="./Components/SidePanel/script.js"></script>
    <script src="./Components/Spotify/spotify.js"></script>
    <script src="./Components/ContextMenu/contextMenu.js"></script>
    <script src="./Components/StickyNotes/sticky-notes.js"></script>
</body>

</html>
